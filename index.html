<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b2545"><link rel="icon" href="icon-192.png"><title>SkyGrowth Client Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--cd:#fff;--tx:#14213d;--mu:#667085;--pr:#1d6fe0;--bd:#dde3ee;--ok:#12805c;--bad:#c0392b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1626;--cd:#17233b;--tx:#e8eefc;--mu:#9aa8c4;--bd:#2a3a5c;--pr:#5b9dff;--ok:#3ddc97;--bad:#ff7b6b}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1626;--cd:#17233b;--tx:#e8eefc;--mu:#9aa8c4;--bd:#2a3a5c;--pr:#5b9dff;--ok:#3ddc97;--bad:#ff7b6b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:12px 12px 84px}
h2{font-size:18px;margin:6px 0 10px}h3{font-size:15px;margin:0 0 6px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mu{color:var(--mu);font-size:13px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:3px 0}
input[type=checkbox]{width:auto}
button,.b{background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 12px;font:inherit;font-weight:600;text-decoration:none;display:inline-block;cursor:pointer}
.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}.x{background:var(--bad)}.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:12px}nav .on{color:var(--pr)}
.grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:6px}.sv{border-top:1px solid var(--bd);padding:8px 0}
.t{position:fixed;left:12px;right:12px;bottom:70px;background:#14213d;color:#fff;padding:10px;border-radius:8px;text-align:center}
</style></head><body><div id="app"></div><div id="toast"></div>
<nav id="nav"></nav>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const K='sg_cm1',D=[['Client Communication','Member 1'],['Business Analysis','Member 1'],['Content Planning','Member 1'],['Reel Ideas','Member 1'],['Script Writing','Member 1'],['Video Shooting','Member 1'],['Video Editing','Member 2'],['Thumbnail Designing','Member 2'],['Caption & Hashtags','Member 2'],['Instagram Posting','Member 2'],['Facebook Posting','Member 2'],['Meta Ads Setup','Member 1'],['Ads Monitoring','Member 1'],['Monthly Report','Member 1']];
const def=()=>({co:{name:'SkyGrowth Digital',addr:'',phone:'',gst:'',pay:'',terms:'50% advance to confirm the booking. Balance before final delivery.'},team:['Member 1','Member 2'],svc:D.map((x,i)=>({id:'s'+i,name:x[0],price:0,team:x[1],cost:0,unit:'video'})),cl:[],n:1});
let S;try{S=JSON.parse(localStorage.getItem(K))||def()}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
S.pins=S.pins||{a:'',m:''};S.co=Object.assign({intro:'Thank you for considering us. Below is our proposed plan and pricing for your business growth.',scope:'',valid:'15'},S.co);
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>'₹'+Number(n||0).toLocaleString('en-IN'),$=s=>document.querySelector(s);
const tot=c=>c.tasks.reduce((a,t)=>a+t.qty*t.price,0),paid=c=>(c.pay||[]).reduce((a,p)=>a+p.a,0),bal=c=>tot(c)-paid(c);
const opt=(v)=>S.team.map(n=>`<option ${n===v?'selected':''}>${e(n)}</option>`).join('');
let V='dash',CID=null,ADD=false,ROLE='admin',AUTH=!(S.pins.a||S.pins.m);const isA=()=>ROLE==='admin';const ST=['Draft','Proposal sent','Approved','Started','Completed'];const fin=c=>{const tc=c.tasks.reduce((a,t)=>a+t.qty*t.cost,0),ex=(c.exp||[]).reduce((a,x)=>a+x.a,0);return{rev:tot(c),tc,ex,pr:tot(c)-tc-ex}};
function toast(t){$('#toast').innerHTML=`<div class="t">${e(t)}</div>`;setTimeout(()=>$('#toast').innerHTML='',2500)}
async function dl(name,data){try{const d=window.claude&&await window.claude.use('downloads');if(d){await d.save({filename:name,data});return}const bl=data instanceof Blob?data:new Blob([data]),l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download=name;document.body.appendChild(l);l.click();l.remove()}catch(x){toast(x&&x.code==='declined'?'Cancelled':'Download failed')}}
function nav(){const t=[['dash','Home'],['cl','Clients']].concat(isA()?[['sv','Services'],['rp','Reports'],['st','Settings']]:[]);$('#nav').innerHTML=t.map(([k,l])=>`<button class="${V===k?'on':''}" data-a="go" data-v="${k}">${l}</button>`).join('')}
function dash(){const act=S.cl.filter(c=>(c.st||'Started')==='Started'&&c.tasks.some(t=>!t.done)),prop=S.cl.filter(c=>['Draft','Proposal sent','Approved'].includes(c.st));const pend=S.cl.reduce((a,c)=>a+Math.max(0,bal(c)),0);const F=S.cl.reduce((a,c)=>{const f=fin(c);a.r+=f.rev;a.x+=f.tc+f.ex;return a},{r:0,x:0});
return `<h2>Dashboard</h2><div class="r"><div class="c" style="flex:1"><div class="mu">Clients</div><h2>${S.cl.length}</h2></div><div class="c" style="flex:1"><div class="mu">Payment pending</div><h2 class="bad">${m(pend)}</h2></div></div>`+(isA()?`<div class="c r sp"><div><div class="mu">Revenue</div><b>${m(F.r)}</b></div><div><div class="mu">Expenses</div><b>${m(F.x)}</b></div><div><div class="mu">Profit</div><b class="ok">${m(F.r-F.x)}</b></div></div>`:'')+
(prop.length?`<h3>Proposals</h3>`+prop.map(c=>`<div class="c r sp" data-a="open" data-c="${c.id}"><b>${e(c.name)}</b><span class="mu">${e(c.st)}</span></div>`).join(''):'')+`<h3>Work to do</h3>`+
(act.map(c=>{const p=c.tasks.filter(t=>!t.done);return `<div class="c"><div class="r sp"><b>${e(c.name)}</b><span class="mu">${p.length} left</span></div><div class="sv">Now: <b>${e(p[0].name)}</b></div>${p[1]?`<div class="mu">Next: ${e(p[1].name)}</div>`:''}<div class="r" style="margin-top:6px"><button data-a="done" data-c="${c.id}" data-t="${p[0].id}">Mark done, move to next</button><button class="g" data-a="open" data-c="${c.id}">Open</button></div></div>`}).join('')||'<div class="c mu">No running work. Start a client after proposal approval.</div>')}
function list(){return `<div class="r sp"><h2>Clients</h2><button data-a="new">+ New client</button></div>`+(S.cl.map(c=>`<div class="c" data-a="open" data-c="${c.id}"><div class="r sp"><b>${e(c.name)}</b><span class="${bal(c)>0?'bad':'ok'}">${bal(c)>0?'Due '+m(bal(c)):'Paid'}</span></div><div class="mu">${e(c.co)} · ${c.tasks.filter(t=>t.done).length}/${c.tasks.length} tasks done</div></div>`).join('')||'<div class="c mu">No clients yet.</div>')}
function form(){const A=isA();return `<h2>New client</h2><div class="c"><input id="n_name" placeholder="Client name"><input id="n_co" placeholder="Company name"><input id="n_ph" placeholder="Phone (WhatsApp)" inputmode="tel"><input id="n_ad" placeholder="Address"></div><h3>Services this client wants</h3><div class="c">`+S.svc.map(s=>`<div class="sv" data-s="${s.id}"><label class="r"><input type="checkbox" class="ck"> <b>${e(s.name)}</b> <span class="mu">per ${e(s.unit||'unit')}</span></label><div class="grid"><input class="q" type="number" min="1" value="1" aria-label="Qty"><input class="p" type="number" value="${s.price}" aria-label="Price">${A?`<input class="k" type="number" value="${s.cost}" aria-label="Expense">`:`<input class="k" type="hidden" value="${s.cost}">`}</div>${A?`<select class="w">${opt(s.team)}</select>`:`<input class="w" type="hidden" value="${e(s.team)}">`}<div class="mu">Qty · Price per unit${A?' · Expense per unit · Team member':''}</div></div>`).join('')+`</div><div class="r"><button data-a="create">Save and create proposal</button><button class="g" data-a="go" data-v="cl">Cancel</button></div>`}
function detail(c){const i=S.cl.indexOf(c),f=fin(c),A=isA(),ph=c.phone.replace(/\D/g,'').replace(/^(\d{10})$/,'91$1');
const msg=encodeURIComponent(`Hello ${c.name}, a friendly reminder from ${S.co.name}: balance payment of ${m(bal(c))} is pending. Thank you.`),pm=encodeURIComponent(`Hello ${c.name}, thank you for your interest. Our proposal from ${S.co.name} (total ${m(tot(c))}) is ready. I am sharing the PDF with you. Please confirm to start.`);
return `<button class="g" data-a="go" data-v="cl">← Back</button><h2>${e(c.name)}</h2><div class="mu">${e(c.co)} · ${e(c.phone)}</div>
<div class="c"><h3>Proposal and start</h3><label class="mu">Status</label><select data-p="cl.${i}.st">${ST.map(x=>`<option ${x===(c.st||'Started')?'selected':''}>${x}</option>`).join('')}</select><div class="r"><div style="flex:1"><label class="mu">Approved on</label><input type="date" data-p="cl.${i}.appr" value="${e(c.appr||'')}"></div><div style="flex:1"><label class="mu">Work started on</label><input type="date" data-p="cl.${i}.start" value="${e(c.start||'')}"></div></div><label class="mu">Note on proposal (editable)</label><textarea rows="2" data-p="cl.${i}.note">${e(c.note||'')}</textarea><div class="r"><button data-a="prop" data-c="${c.id}">Proposal PDF</button><a class="b g" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${pm}">Send on WhatsApp</a></div></div>
<div class="c"><div class="r sp"><span>Total</span><b>${m(tot(c))}</b></div><div class="r sp"><span>Received</span><b class="ok">${m(paid(c))}</b></div><div class="r sp"><span>Balance</span><b class="bad">${m(bal(c))}</b></div><div class="r"><input id="pa" type="number" placeholder="Amount received" style="flex:1"><button data-a="pay" data-c="${c.id}">Add payment</button></div></div>
<div class="r"><button data-a="inv" data-c="${c.id}">Client bill PDF</button>${A?`<button class="g" data-a="tb" data-c="${c.id}">Team bill PDF</button>`:''}<a class="b g" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${msg}">Payment reminder</a></div>
<h3 style="margin-top:12px">Work (${c.tasks.reduce((a,t)=>a+t.qty,0)} units)</h3>`+c.tasks.map((t,j)=>`<div class="c"><label class="r"><input type="checkbox" data-a="tog" data-c="${c.id}" data-t="${t.id}" ${t.done?'checked':''}><b>${e(t.name)}</b> <span class="mu">per ${e(t.unit||'unit')}</span></label><div class="grid"><input type="number" data-p="cl.${i}.tasks.${j}.qty" value="${t.qty}"><input type="number" data-p="cl.${i}.tasks.${j}.price" value="${t.price}">${A?`<input type="number" data-p="cl.${i}.tasks.${j}.cost" value="${t.cost}">`:''}</div>${A?`<select data-p="cl.${i}.tasks.${j}.team">${opt(t.team)}</select>`:''}<div class="mu">Qty · Price per unit${A?' · Expense per unit · Team member':''}</div></div>`).join('')+
`<div class="c"><h3>Add extra / custom work</h3><input id="x_n" placeholder="Work name"><div class="grid"><input id="x_q" type="number" value="1"><input id="x_p" type="number" placeholder="Price"><input id="x_k" type="number" placeholder="Expense"></div><select id="x_w">${opt()}</select><button data-a="extra" data-c="${c.id}">Add</button></div>`+
(A?`<div class="c"><h3>Expenses and profit</h3><div class="r sp"><span>Revenue</span><b>${m(f.rev)}</b></div><div class="r sp"><span>Team / work expense</span><b>${m(f.tc)}</b></div>${(c.exp||[]).map((x,k)=>`<div class="r sp"><span>${e(x.n)}</span><span>${m(x.a)} <button class="x" data-a="dex" data-c="${c.id}" data-i="${k}">×</button></span></div>`).join('')}<div class="r"><input id="e_n" placeholder="Other expense (travel, model, ads...)" style="flex:2"><input id="e_a" type="number" placeholder="Amount" style="flex:1"><button data-a="exp" data-c="${c.id}">Add</button></div><div class="r sp" style="margin-top:6px"><b>Profit</b><b class="${f.pr<0?'bad':'ok'}">${m(f.pr)}</b></div></div>`:'')+`<button class="x" data-a="del" data-c="${c.id}">Delete client</button>`}
function svc(){return `<h2>Service catalog</h2><div class="mu" style="margin-bottom:8px">Set unit, price and your expense for each service once. Used in onboarding and proposals.</div>`+S.svc.map((s,i)=>`<div class="c"><input data-p="svc.${i}.name" value="${e(s.name)}"><div class="grid"><select data-p="svc.${i}.unit">${['video','month','one-time'].map(u=>`<option ${u===s.unit?'selected':''}>${u}</option>`).join('')}</select><input type="number" data-p="svc.${i}.price" value="${s.price}"><input type="number" data-p="svc.${i}.cost" value="${s.cost}"></div><div class="mu">Unit · Price per unit · Expense per unit · Margin ${m(s.price-s.cost)}</div><div class="r sp"><select data-p="svc.${i}.team" style="flex:1">${opt(s.team)}</select><button class="x" data-a="dsv" data-i="${i}">Delete</button></div></div>`).join('')+`<button data-a="asv">+ Add service</button>`}
function rep(){return `<h2>Reports (Excel)</h2><div class="c"><p class="mu">One Excel file with Clients, Work, Payments and Team Bill sheets.</p><button data-a="xl">Download Excel</button></div><div class="c"><h3>Team bills (PDF)</h3>`+S.team.map(t=>`<div class="r sp sv"><span>${e(t)}</span><button class="g" data-a="tbm" data-m="${e(t)}">Download</button></div>`).join('')+`</div>`}
function sett(){const c=S.co;return `<h2>Company and proposal details</h2><div class="c">`+[['name','Company name'],['addr','Address'],['phone','Phone'],['gst','GST number (optional)'],['pay','Bank / UPI details'],['intro','Proposal introduction'],['scope','Scope notes on proposal'],['valid','Proposal valid for (days)'],['terms','Terms']].map(([k,l])=>`<label class="mu">${l}</label><input data-p="co.${k}" value="${e(c[k])}">`).join('')+`<label class="mu">Team members (comma separated)</label><input data-p="team" value="${e(S.team.join(', '))}"></div><h3>Access PINs</h3><div class="c"><input data-p="pins.a" type="password" placeholder="Admin PIN" value="${e(S.pins.a)}"><input data-p="pins.m" type="password" placeholder="Manager PIN" value="${e(S.pins.m)}"><div class="mu">Simple lock on this device. Manager cannot see expenses, profit, team costs or settings.</div></div><h3>Backup</h3><div class="c"><button data-a="bk">Download backup</button><div class="mu">Save this file to Google Drive. Restore:</div><input type="file" id="rf" accept=".json"></div>`}
function render(){if(!isA()&&['sv','rp','st'].includes(V))V='dash';if(!AUTH){$('#nav').innerHTML='';$('#app').innerHTML=`<div class="c"><h2>${e(S.co.name)}</h2><input id="pin" type="password" inputmode="numeric" placeholder="Enter PIN"><button data-a="login">Login</button></div>`;return}nav();$('#app').innerHTML=V==='dash'?dash():V==='cl'?(ADD?form():CID?detail(S.cl.find(c=>c.id===CID)):list()):V==='sv'?svc():V==='rp'?rep():sett()}
function head(d,t){d.setFontSize(18);d.text(S.co.name,14,18);d.setFontSize(9);d.text([S.co.addr,'Phone: '+S.co.phone+(S.co.gst?'   GST: '+S.co.gst:'')].filter(Boolean),14,24);d.setFontSize(14);d.text(t,196,18,{align:'right'})}
const R=n=>'Rs. '+Number(n||0).toLocaleString('en-IN');
function invoice(c){if(!c.inv)c.inv=S.n++,save();const d=new jspdf.jsPDF();head(d,'INVOICE');d.setFontSize(10);d.text(`Invoice No: INV-${String(c.inv).padStart(3,'0')}\nDate: ${new Date().toLocaleDateString('en-IN')}`,196,25,{align:'right'});d.text(`Bill to:\n${c.name}\n${c.co}\n${c.addr||''}`,14,42);
d.autoTable({startY:62,head:[['Service','Qty','Rate','Amount']],body:c.tasks.map(t=>[t.name,t.qty,R(t.price),R(t.qty*t.price)]),foot:[['','','Total',R(tot(c))],['','','Received',R(paid(c))],['','','Balance due',R(bal(c))]],headStyles:{fillColor:[11,37,69]},footStyles:{fillColor:[234,242,255],textColor:20}});
let y=d.lastAutoTable.finalY+10;d.setFontSize(9);d.text(['Payment details: '+(S.co.pay||'-'),'Terms: '+S.co.terms],14,y);dl(`Invoice_${c.name.replace(/\W+/g,'_')}.pdf`,d.output('blob'))}
function tbill(mem,cid){const d=new jspdf.jsPDF();head(d,'TEAM WORK BILL');const rows=[];let T=0;S.cl.filter(c=>!cid||c.id===cid).forEach(c=>c.tasks.filter(t=>t.done&&(!mem||t.team===mem)).forEach(t=>{T+=t.qty*t.cost;rows.push([c.name,t.name,t.team,t.qty,R(t.cost),R(t.qty*t.cost)])}));
d.setFontSize(10);d.text('Internal copy. Completed work only. Date: '+new Date().toLocaleDateString('en-IN'),14,36);d.autoTable({startY:42,head:[['Client','Work','Team','Qty','Cost','Amount']],body:rows,foot:[['','','','','Total payable',R(T)]],headStyles:{fillColor:[11,37,69]},footStyles:{fillColor:[234,242,255],textColor:20}});dl(`TeamBill_${mem||'All'}.pdf`,d.output('blob'))}
function proposal(c){const d=new jspdf.jsPDF();head(d,'PROPOSAL');d.setFontSize(10);d.text('Date: '+new Date().toLocaleDateString('en-IN')+'\nValid for: '+S.co.valid+' days',196,25,{align:'right'});d.text(`Prepared for:\n${c.name}\n${c.co}`,14,42);const it=d.splitTextToSize((S.co.intro||'')+(c.note?'\n\n'+c.note:''),180);d.text(it,14,62);
d.autoTable({startY:64+it.length*5,head:[['Service','Unit','Qty','Rate','Amount']],body:c.tasks.map(t=>[t.name,t.unit||'',t.qty,R(t.price),R(t.qty*t.price)]),foot:[['','','','Total',R(tot(c))]],headStyles:{fillColor:[11,37,69]},footStyles:{fillColor:[234,242,255],textColor:20}});
const tx=d.splitTextToSize('Scope: '+(S.co.scope||'-')+'\nPayment details: '+(S.co.pay||'-')+'\nTerms: '+S.co.terms,180),y=d.lastAutoTable.finalY+8;d.setFontSize(9);d.text(tx,14,y);d.text('Client signature: ____________________     Date: ____________',14,Math.min(y+tx.length*5+16,280));dl(`Proposal_${c.name.replace(/\W+/g,'_')}.pdf`,d.output('blob'))}
function excel(){const W=XLSX.utils,wb=W.book_new(),cl=[],tk=[],py=[],ex=[];S.cl.forEach(c=>{const f=fin(c);cl.push({Client:c.name,Company:c.co,Phone:c.phone,Status:c.st||'Started',Approved:c.appr||'',Started:c.start||'',Revenue:f.rev,TeamExpense:f.tc,OtherExpenses:f.ex,Profit:f.pr,Received:paid(c),Balance:bal(c)});c.tasks.forEach(t=>tk.push({Client:c.name,Work:t.name,Unit:t.unit||'',Qty:t.qty,Price:t.price,Amount:t.qty*t.price,Team:t.team,Expense:t.qty*t.cost,Status:t.done?'Done':'Pending'}));(c.pay||[]).forEach(p=>py.push({Client:c.name,Date:p.d,Amount:p.a}));(c.exp||[]).forEach(x=>ex.push({Client:c.name,Expense:x.n,Amount:x.a}))});
const tb=tk.filter(t=>t.Status==='Done').map(t=>({Team:t.Team,Client:t.Client,Work:t.Work,Amount:t.Expense}));
[['Clients',cl],['Work',tk],['Payments',py],['Expenses',ex],['Team Bill',tb]].forEach(([n,r])=>W.book_append_sheet(wb,W.json_to_sheet(r.length?r:[{}]),n));dl('SkyGrowth_Report.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}))}
const cid=id=>S.cl.find(c=>c.id===id);
const A={login:()=>{const p=$('#pin').value;if(p&&p===S.pins.a){AUTH=1;ROLE='admin'}else if(p&&p===S.pins.m){AUTH=1;ROLE='manager'}else toast('Wrong PIN')},prop:d=>{proposal(cid(d.c));return 1},exp:d=>{const c=cid(d.c);(c.exp=c.exp||[]).push({n:$('#e_n').value.trim()||'Expense',a:+$('#e_a').value||0})},dex:d=>{cid(d.c).exp.splice(+d.i,1)},bk:()=>{dl('SkyGrowth_Backup.json',JSON.stringify(S));return 1},go:d=>{V=d.v;ADD=false;CID=null},open:d=>{V='cl';CID=d.c},new:()=>{V='cl';ADD=true},
create:()=>{const g=s=>$(s).value.trim();if(!g('#n_name'))return toast('Enter client name');const tasks=[...document.querySelectorAll('[data-s]')].filter(r=>r.querySelector('.ck').checked).map((r,i)=>({id:'t'+Date.now()+i,name:S.svc.find(s=>s.id===r.dataset.s).name,qty:+r.querySelector('.q').value||1,price:+r.querySelector('.p').value||0,cost:+r.querySelector('.k').value||0,team:r.querySelector('.w').value,unit:S.svc.find(s=>s.id===r.dataset.s).unit||'video',done:false}));if(!tasks.length)return toast('Select at least one service');const c={id:'c'+Date.now(),name:g('#n_name'),co:g('#n_co'),phone:g('#n_ph'),addr:g('#n_ad'),tasks,pay:[],exp:[],st:'Draft'};S.cl.push(c);ADD=false;CID=c.id},
done:d=>{cid(d.c).tasks.find(t=>t.id===d.t).done=true},tog:d=>{const t=cid(d.c).tasks.find(t=>t.id===d.t);t.done=!t.done},
pay:d=>{const a=+$('#pa').value;if(!a)return;(cid(d.c).pay=cid(d.c).pay||[]).push({d:new Date().toLocaleDateString('en-IN'),a})},
extra:d=>{const n=$('#x_n').value.trim();if(!n)return;cid(d.c).tasks.push({id:'t'+Date.now(),name:n,qty:+$('#x_q').value||1,price:+$('#x_p').value||0,cost:+$('#x_k').value||0,team:$('#x_w').value,done:false})},
del:d=>{S.cl=S.cl.filter(c=>c.id!==d.c);CID=null},asv:()=>S.svc.push({id:'s'+Date.now(),name:'New service',price:0,team:S.team[0],cost:0,unit:'video'}),dsv:d=>S.svc.splice(+d.i,1),
inv:d=>{invoice(cid(d.c));return 1},tb:d=>{tbill(null,d.c);return 1},tbm:d=>{tbill(d.m);return 1},xl:()=>{excel();return 1}};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b||b.tagName==='INPUT'&&b.type==='checkbox'&&ev.detail===0)return;if(b.tagName==='INPUT'&&ev.target!==b)return;const r=A[b.dataset.a]&&A[b.dataset.a](b.dataset);if(r!==1){save();render()}});
document.addEventListener('change',ev=>{const p=ev.target.dataset.p;if(!p)return;let v=ev.target.value;const k=p.split('.');if(p==='team')S.team=v.split(',').map(s=>s.trim()).filter(Boolean);else{let o=S;k.slice(0,-1).forEach(x=>o=o[x]);const l=k[k.length-1];o[l]=ev.target.type==='number'?+v:v}save()});
document.addEventListener('change',ev=>{if(ev.target.id!=='rf')return;const f=ev.target.files[0];if(!f)return;f.text().then(t=>{try{S=JSON.parse(t);save();render();toast('Backup restored')}catch(x){toast('Invalid backup file')}})});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
